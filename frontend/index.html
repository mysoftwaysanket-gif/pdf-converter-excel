<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Medical PDF to CSV Converter</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #1d2671, #c33764);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            width: 460px;
            padding: 40px 35px;
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.3);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #1d2671;
        }

        label {
            font-weight: 500;
            display: block;
            margin-top: 18px;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(90deg, #1d2671, #c33764);
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .loader {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #eee;
            border-top: 4px solid #c33764;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>📄 PDF → CSV Converter</h2>

    <form id="convertForm">

        <label>Select Category</label>
        <select name="category" required>

            <option value="" disabled selected>-- Select Category --</option>

            <optgroup label="AIQ / MCC Categories">
                <option value="consolidated list mcc">Consolidated List MCC</option>
                <option value="pg medical mcc 1 2025">PG Medical MCC 1 2025</option>
                <option value="pg medical mcc 2 2025">PG Medical MCC 2 2025</option>
                <option value="merit list aiq">Merit List AIQ</option>
            </optgroup>

            <optgroup label="MBBS / BDS">
                <option value="mbbs - bds">MBBS - BDS</option>
                <option value="mbbs">MBBS</option>
                <option value="bds">BDS</option>
                <option value="bds fee structure">BDS Fee Structure</option>
            </optgroup>

            <optgroup label=" BAMS / BHMS">
                <option value="bams- bhms">BAMS - BHMS</option>
                <option value="bhms"> BHMS</option>   <!-- 🔥 FIXED -->
                <option value="bams srv">BAMS SRV</option>
                <option value="bams">BAMS</option>
                <option value="bams aiq">BAMS AIQ</option>
            </optgroup>

            <optgroup label="CET / State Rounds">
                <option value="mh ai">MH AI</option>
                <option value="mht cet">MHT CET</option>
                <option value="mh cet">MH CET</option>
            </optgroup>

            <optgroup label="Other Lists">
                <option value="medical fee">Medical Fee</option>
                <option value="provisional merit list">Provisional Merit List</option>
                <option value="selection list">Selection List</option>
                <option value="bpth">BPTH</option>
            </optgroup>

        </select>

        <label>Select PDF File</label>
        <input type="file" name="file" accept=".pdf" required>

        <button id="submitBtn" type="submit">Convert to CSV</button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <div>Converting PDF to CSV… Please wait</div>
        </div>
    </form>
</div>

<script>
const form = document.getElementById("convertForm");
const loader = document.getElementById("loader");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const formData = new FormData(form);

    loader.style.display = "block";
    button.disabled = true;
    button.innerText = "Converting...";

    try {
        const response = await fetch("http://127.0.0.1:5000/convert", {
            method: "POST",
            body: formData
        });

        if (!response.ok) throw new Error("Server error");

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "converted.csv";
        document.body.appendChild(a);
        a.click();
        a.remove();

    } catch (error) {
        alert("❌ Conversion failed. Please check your PDF or server.");
    }

    loader.style.display = "none";
    button.disabled = false;
    button.innerText = "Convert to CSV";
});
</script>
<!-- sanet -->
</body>
</html>
<!-- this is the frontend code -->
